name: Windows project RDP test

on:
  workflow_dispatch:
    inputs:
      client_ipv4:
        description: Tailscale IPv4 address of the authorized RDP client
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-project-rdp
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Set cleanup deadline
        run: |
          "RDP_END_AT=$([DateTimeOffset]::UtcNow.AddMinutes(28).ToString('o'))" >> $env:GITHUB_ENV

      - name: Check out the project for the development test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: project
          persist-credentials: false

      - name: Open RDP to the authorized Tailscale device
        env:
          CLIENT_IPV4: ${{ inputs.client_ipv4 }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-TailscaleIPv4([string]$Address) {
            $parsed = $null
            return [Net.IPAddress]::TryParse($Address, [ref]$parsed) -and
              $parsed.AddressFamily -eq [Net.Sockets.AddressFamily]::InterNetwork -and
              $parsed.ToString() -ceq $Address -and
              $parsed.GetAddressBytes()[0] -eq 100 -and
              $parsed.GetAddressBytes()[1] -in (64..127)
          }

          function Test-RdpPort([string]$Port) {
            if ($Port -in ('Any', '3389')) { return $true }
            if ($Port -match '^(\d+)-(\d+)$') {
              return [int]$Matches[1] -le 3389 -and [int]$Matches[2] -ge 3389
            }
            return $false
          }

          function Get-RdpInboundAllows {
            $rules = Get-NetFirewallRule -PolicyStore ActiveStore -Direction Inbound -Enabled True -Action Allow
            foreach ($rule in $rules) {
              $port = $rule | Get-NetFirewallPortFilter
              if ($port.Protocol -notin ('Any', 'TCP', '6')) { continue }
              if (-not ($port.LocalPort | Where-Object { Test-RdpPort $_ })) { continue }
              $service = ($rule | Get-NetFirewallServiceFilter).Service
              if ($service -and $service -notin ('Any', 'TermService')) { continue }
              $program = ($rule | Get-NetFirewallApplicationFilter).Program
              if ($program -and $program -notin ('Any', 'System') -and $program -notmatch '(^|[\\/])svchost\.exe$') { continue }
              $rule
            }
          }

          if (-not (Test-TailscaleIPv4 $env:CLIENT_IPV4)) {
            throw 'client_ipv4 must be the Tailscale IPv4 address of the client.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'The TAILSCALE_AUTH_KEY secret is required.'
          }
          if ($env:RDP_PASSWORD.Length -notin (12..127) -or $env:RDP_PASSWORD -match '[\r\n]') {
            throw 'The RDP_PASSWORD secret must contain 12 to 127 characters and no line breaks.'
          }

          $authKey = $env:TAILSCALE_AUTH_KEY
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Remove-Item Env:\TAILSCALE_AUTH_KEY, Env:\RDP_PASSWORD
          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $keyFile = Join-Path $env:RUNNER_TEMP ("tailscale-{0}.key" -f [guid]::NewGuid())
          $rdpSettings = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $allowRule = 'ProjectRdpAuthorizedClient'
          $user = $null
          $connected = $false

          try {
            # Keep the listener gated until the effective firewall rules are verified.
            Set-ItemProperty $rdpSettings -Name fDenyTSConnections -Value 1
            $msi = Join-Path $env:RUNNER_TEMP 'tailscale-amd64.msi'
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.104.7-amd64.msi' -OutFile $msi -TimeoutSec 90
            $signature = Get-AuthenticodeSignature -LiteralPath $msi
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'Tailscale Inc.') {
              throw 'The Tailscale installer signature or publisher could not be verified.'
            }
            $installer = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -WindowStyle Hidden -Wait -PassThru
            if ($installer.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $tailscale)) {
              throw "Tailscale installation failed with MSI code $($installer.ExitCode)."
            }

            Set-NetFirewallProfile -Profile Domain, Private, Public -Enabled True -DefaultInboundAction Block
            $profiles = @(Get-NetFirewallProfile -PolicyStore ActiveStore)
            if ($profiles.Count -ne 3 -or ($profiles | Where-Object { $_.Enabled -ne 'True' -or $_.DefaultInboundAction -ne 'Block' })) {
              throw 'The effective Windows firewall policy does not block inbound connections by default.'
            }
            foreach ($existing in @(Get-RdpInboundAllows)) {
              if ($existing.PolicyStoreSourceType -ne 'Local') {
                throw 'An existing non-local firewall rule allows RDP and cannot be disabled safely.'
              }
              Disable-NetFirewallRule -Name $existing.Name -PolicyStore PersistentStore
            }
            if (@(Get-RdpInboundAllows).Count) {
              throw 'An existing inbound rule still allows RDP.'
            }

            $user = New-LocalUser -Name 'rdp-dev' -Password $password -Description 'Temporary project RDP test'
            Add-LocalGroupMember -SID ([Security.Principal.SecurityIdentifier]::new('S-1-5-32-555')) -Member $user
            & icacls.exe (Join-Path $env:GITHUB_WORKSPACE 'project') /grant ('*{0}:(OI)(CI)M' -f $user.SID.Value) *> $null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to grant the temporary user access to the project checkout.' }

            try {
              [IO.File]::WriteAllText($keyFile, $authKey)
              $authKey = $null
              $registration = @(& $tailscale up "--auth-key=file:$keyFile" --accept-dns=false --accept-routes=false "--hostname=rdp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --timeout=90s 2>&1)
              if ($LASTEXITCODE -ne 0) {
                $reason = $registration -join ' '
                if ($reason -match 'already (been )?used|expired|invalid (auth )?key|invalid key|key not found|key does not exist') {
                  throw 'Tailscale rejected the auth key as invalid, expired or already used.'
                }
                if ($reason -match 'approval|not authorized|denied') {
                  throw 'Tailscale denied registration or requires device approval.'
                }
                if ($reason -match 'timed?\s*out|deadline exceeded') {
                  throw 'Tailscale registration timed out.'
                }
                throw "Tailscale registration failed with exit code $LASTEXITCODE."
              }
              $connected = $true
            } finally {
              Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
            }

            $assignedAddresses = @(& $tailscale ip -4 2>$null)
            $serverIPv4 = [string]$assignedAddresses[0]
            if ($LASTEXITCODE -ne 0 -or $assignedAddresses.Count -ne 1 -or -not (Test-TailscaleIPv4 $serverIPv4)) {
              throw 'The runner has no Tailscale IPv4 address.'
            }
            $adapter = @(Get-NetIPAddress -AddressFamily IPv4 -IPAddress $serverIPv4)
            if ($adapter.Count -ne 1 -or $adapter[0].InterfaceAlias -notlike '*Tailscale*') {
              throw 'The runner IPv4 address could not be mapped to the Tailscale adapter.'
            }

            $blockRules = @('ProjectRdpBlockUdp')
            $inbound = @{ Direction = 'Inbound'; LocalPort = 3389; Profile = 'Any' }
            New-NetFirewallRule @inbound -Name $blockRules[0] -DisplayName $blockRules[0] -Action Block -Protocol UDP | Out-Null
            $otherInterfaces = @(Get-NetAdapter | Where-Object ifIndex -ne $adapter[0].InterfaceIndex | Select-Object -ExpandProperty Name)
            if ($otherInterfaces.Count) {
              $blockRules += 'ProjectRdpOtherInterfaces'
              New-NetFirewallRule @inbound -Name 'ProjectRdpOtherInterfaces' -DisplayName 'ProjectRdpOtherInterfaces' -Action Block -Protocol TCP -InterfaceAlias $otherInterfaces | Out-Null
            }
            New-NetFirewallRule @inbound -Name $allowRule -DisplayName $allowRule -Action Allow -Protocol TCP -InterfaceAlias $adapter[0].InterfaceAlias -LocalAddress $serverIPv4 -RemoteAddress $env:CLIENT_IPV4 -Service TermService | Out-Null
            $effectiveRules = @(Get-NetFirewallRule -PolicyStore ActiveStore -Name ($blockRules + $allowRule))
            if ($effectiveRules.Count -ne ($blockRules.Count + 1) -or ($effectiveRules | Where-Object Enabled -ne True)) {
              throw 'The intended firewall rules are not all enabled in the effective policy.'
            }
            if (@(Get-RdpInboundAllows | Where-Object Name -ne $allowRule).Count) {
              throw 'An unexpected inbound rule allows RDP.'
            }

            $listenerSettings = Join-Path $rdpSettings 'WinStations\RDP-Tcp'
            Set-ItemProperty $listenerSettings -Name PortNumber -Value 3389
            Set-ItemProperty $listenerSettings -Name UserAuthentication -Value 1
            Set-ItemProperty $listenerSettings -Name SecurityLayer -Value 2
            Set-ItemProperty $rdpSettings -Name fDenyTSConnections -Value 0
            Start-Service TermService
            $rdpProcess = (Get-CimInstance Win32_Service -Filter "Name='TermService'").ProcessId
            for ($attempt = 0; $attempt -lt 15; $attempt++) {
              $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue |
                Where-Object OwningProcess -eq $rdpProcess
              if ($listener) { break }
              Start-Sleep -Seconds 2
            }
            if (-not $listener) { throw 'The RDP service did not open TCP 3389.' }

            $computer = Get-CimInstance Win32_ComputerSystem
            Write-Host "RDP listo. Dirección $serverIPv4. Usuario .\rdp-dev. Proyecto en $env:GITHUB_WORKSPACE\project."
            Write-Host ('RAM {0:N2} GiB. Procesadores lógicos {1}.' -f ($computer.TotalPhysicalMemory / 1GB), $computer.NumberOfLogicalProcessors)
            $deadline = [DateTimeOffset]::Parse($env:RDP_END_AT, [cultureinfo]::InvariantCulture)
            while ([DateTimeOffset]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 5
            }
          } finally {
            Set-ItemProperty $rdpSettings -Name fDenyTSConnections -Value 1 -ErrorAction SilentlyContinue
            Disable-NetFirewallRule -Name $allowRule -ErrorAction SilentlyContinue
            if ($user) { Remove-LocalUser -SID $user.SID -ErrorAction SilentlyContinue }
            if ($connected) { & $tailscale logout *> $null }
            $password.Dispose()
          }
